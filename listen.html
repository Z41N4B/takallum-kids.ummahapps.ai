<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice check: Takallum Kids</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EDF1F6; --surface:#FFFFFF; --sunk:#E3E9F1; --ink:#15233F; --muted:#56637D;
  --lapis:#1E4FA0; --lapis-ink:#FFFFFF; --brass:#9A6A0E; --brass-soft:#F3E6C8;
  --line:#D3DBE6; --good:#1F6B4A; --good-soft:#DDF0E6; --miss:#A8382C; --miss-soft:#F8E1DE;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0D1424; --surface:#162035; --sunk:#111A2C; --ink:#E6EBF4; --muted:#9AA6BD;
    --lapis:#8DB0EC; --lapis-ink:#0D1424; --brass:#E2B75E; --brass-soft:#3A2F17;
    --line:#2A3753; --good:#5FC498; --good-soft:#173528; --miss:#F08A7E; --miss-soft:#3D1F1C;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:6px 0 4px}
h2{font-size:1.05rem;margin:22px 2px 2px}
.back{color:var(--lapis);font-weight:600;text-decoration:none}
.intro,.sub{color:var(--muted);margin:0 2px 10px;font-size:.95rem}
.notice{background:var(--brass-soft);border-radius:12px;padding:10px 14px;font-size:.92rem;margin:0 0 12px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.row.ok{border-color:var(--good)}
.row.bad{border-color:var(--miss)}
.ar{font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;direction:rtl}
.word{font-size:2.2rem;line-height:1.6;margin:0;text-align:center}
.mean{margin:0;text-align:center;font-weight:600}
.guide{margin:2px 0 10px;text-align:center;color:var(--muted);font-size:.9rem}
.play{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.play button{border:2px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 14px;min-height:44px;font-weight:600;font-size:.95rem}
.sent{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sent .ar{font-size:1.5rem;line-height:1.6;flex:1;text-align:right}
.sent button{flex:none;border:2px solid var(--line);background:var(--sunk);border-radius:999px;width:44px;height:44px;padding:0}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mark button{border:2px solid var(--line);background:none;border-radius:14px;padding:8px 6px;min-height:46px;font-weight:600;font-size:.95rem}
.mark .y[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.mark .n[aria-pressed="true"]{background:var(--miss-soft);border-color:var(--miss)}
.result{position:sticky;bottom:0;margin-top:18px;background:var(--surface);border:2px solid var(--lapis);border-radius:18px;padding:12px 14px}
.result p{margin:0 0 8px;font-size:.95rem}
.result .ar{font-size:1.25rem}
.result button{width:100%;background:var(--lapis);color:var(--lapis-ink);border:0;border-radius:14px;min-height:48px;font-weight:700}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="./">‹ Takallum Kids</a>
  <h1>Voice check</h1>
  <p class="intro">Tap to hear each word, then mark how it sounds. When you finish, copy your results and send them to Claude.</p>
  <div id="voice"></div>
  <div id="list"></div>
  <section class="result" aria-live="polite"><p id="sum"></p><button id="copy">Copy my results</button></section>
</main>
<script>
/* Words the voice might misread. The words and sentences match index.html. */
const GROUPS = [
  {h:"“My” words", sub:"These should end in a long ī, with no “-iyyun” or “-in” sound.", items:[
    {ar:"رَأْسِي", en:"my head", say:"ra’sī", not:"ra’siyyun", s:"هَذَا رَأْسِي."},
    {ar:"أَنْفِي", en:"my nose", say:"anfī", not:"anfiyyun", s:"هَذَا أَنْفِي."},
    {ar:"أَبِي", en:"my dad", say:"abī", not:"abiyyun", s:"هَذَا أَبِي."},
    {ar:"عَيْنِي", en:"my eye", say:"‘aynī", not:"‘ayniyyun", s:"هَذِهِ عَيْنِي."},
    {ar:"أُذُنِي", en:"my ear", say:"udhunī", not:"udhuniyyun", s:"هَذِهِ أُذُنِي."}
  ]},
  {h:"Same letters, different vowels", sub:"Listen for the vowels in the middle of the word as well as the ending.", items:[
    {ar:"مُدَرِّسَةٌ", en:"a teacher", say:"mudarrisatun", not:"madrasatun", s:"هِيَ مُدَرِّسَةٌ."},
    {ar:"مَدْرَسَةٌ", en:"a school", say:"madrasatun", not:"mudarrisatun", s:"أَذْهَبُ إِلَى الْمَدْرَسَةِ."},
    {ar:"رِجْلٌ", en:"a leg", say:"rijlun", not:"rajulun", s:"هَذِهِ رِجْلِي."},
    {ar:"مَنْ", en:"who?", say:"man", not:"min", s:"مَنْ هَذَا؟"},
    {ar:"وَلَدٌ", en:"a boy", say:"waladun", not:"walada", s:"هَذَا وَلَدٌ."},
    {ar:"بِنْتٌ", en:"a girl", say:"bintun", not:"banat", s:"هَذِهِ بِنْتٌ."},
    {ar:"أُحِبُّ", en:"I love", say:"uḥibbu", not:"aḥabba", s:"أُحِبُّ أُمِّي."},
    {ar:"قِطٌّ", en:"a cat", say:"qiṭṭun", not:"qaṭṭu", s:"هَذَا قِطٌّ."},
    {ar:"أُذُنٌ", en:"an ear", say:"udhunun", not:"adhina"},
    {ar:"مُتْعَبٌ", en:"tired", say:"mut‘abun", not:"mut‘ibun", s:"أَبِي مُتْعَبٌ."},
    {ar:"كِتَابٌ", en:"a book", say:"kitābun", not:"kuttābun", s:"أَقْرَأُ كِتَابًا."},
    {ar:"أَذْهَبُ", en:"I go", say:"adhhabu", not:"adhhaba", s:"أَذْهَبُ إِلَى الْمَدْرَسَةِ."},
    {ar:"آكُلُ", en:"I eat", say:"ākulu", not:"ākilun", s:"آكُلُ خُبْزًا."}
  ]}
];
const ALL = GROUPS.flatMap(g => g.items);
const KEY = "takallum-kids-voice-check";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){}

/* ---------- speech (the same voice choice and speeds as the app) ---------- */
let arVoice = null, voiceState = "unknown";
function loadVoices(){
  if (!("speechSynthesis" in window)){ voiceState = "unsupported"; return; }
  const vs = speechSynthesis.getVoices();
  arVoice = vs.find(v => /^ar[-_]SA/i.test(v.lang)) || vs.find(v => /^ar/i.test(v.lang)) || null;
  if (arVoice) voiceState = "ok";
  else if (vs.length) voiceState = "none";
}
function speak(text, slow){
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = arVoice ? arVoice.lang : "ar-SA";
    if (arVoice) u.voice = arVoice;
    u.rate = slow ? 0.5 : 0.85;
    speechSynthesis.speak(u);
  } catch(e){}
}
function showVoice(){
  const el = document.getElementById("voice");
  el.innerHTML = voiceState === "none" ? '<p class="notice">No Arabic voice found on this device. Add one using the steps on the Takallum Kids home screen, then reload this page.</p>'
    : voiceState === "unsupported" ? '<p class="notice">This browser can’t speak text aloud. Open this page in Chrome or Safari.</p>' : "";
}
if ("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", () => { loadVoices(); showVoice(); });
  setTimeout(() => { loadVoices(); if (voiceState === "unknown") voiceState = "none"; showVoice(); }, 1800);
} else voiceState = "unsupported";

/* ---------- page ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function rowHTML(it){
  const m = marks[it.ar], a = esc(it.ar);
  return '<li class="row' + (m === "ok" ? " ok" : m === "bad" ? " bad" : "") + '" data-word="' + a + '">' +
    '<p class="word ar" lang="ar">' + a + '</p><p class="mean">' + esc(it.en) + '</p>' +
    '<p class="guide">Should sound like <b>' + esc(it.say) + '</b>, not ' + esc(it.not) + '</p>' +
    '<div class="play"><button data-say="' + a + '">🔊 Listen</button><button data-say="' + a + '" data-slow="1">🐢 Slow</button></div>' +
    (it.s ? '<div class="sent"><span class="ar" lang="ar">' + esc(it.s) + '</span><button data-say="' + esc(it.s) + '" aria-label="Listen to the sentence">🔊</button></div>' : "") +
    '<div class="mark"><button class="y" data-mark="ok" aria-pressed="' + (m === "ok") + '">✅ Sounds right</button><button class="n" data-mark="bad" aria-pressed="' + (m === "bad") + '">❌ Sounds wrong</button></div></li>';
}
function renderList(){
  document.getElementById("list").innerHTML = GROUPS.map(g =>
    '<h2>' + esc(g.h) + '</h2><p class="sub">' + esc(g.sub) + '</p><ul class="list">' + g.items.map(rowHTML).join("") + '</ul>').join("");
}
const wrong = () => ALL.filter(it => marks[it.ar] === "bad");
function renderSum(){
  const done = ALL.filter(it => marks[it.ar]).length, w = wrong();
  document.getElementById("sum").innerHTML = done + ' of ' + ALL.length + ' checked' +
    (w.length ? '. Sounds wrong: <span class="ar" lang="ar">' + w.map(it => esc(it.ar)).join("، ") + '</span>' : "");
}
function resultText(){
  const name = it => it.ar + " (" + it.en + ")", list = k => ALL.filter(it => marks[it.ar] === k).map(name);
  const left = ALL.filter(it => !marks[it.ar]).map(name);
  return "Voice check results\n" +
    "Voice: " + (arVoice ? arVoice.name + " (" + arVoice.lang + ")" : "no Arabic voice found") + "\n" +
    "Sounds wrong: " + (list("bad").join(", ") || "none") + "\n" +
    "Sounds right: " + (list("ok").join(", ") || "none") + "\n" +
    "Not checked: " + (left.join(", ") || "none");
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.say){ speak(b.dataset.say, b.dataset.slow === "1"); return; }
  if (b.dataset.mark){
    const w = b.closest("[data-word]").dataset.word;
    if (marks[w] === b.dataset.mark) delete marks[w]; else marks[w] = b.dataset.mark;
    try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch(err){}
    const y = window.scrollY; renderList(); renderSum(); window.scrollTo(0, y);
    return;
  }
  if (b.id === "copy"){
    const t = resultText();
    try { await navigator.clipboard.writeText(t); b.textContent = "Copied ✓"; }
    catch(err){ window.prompt("Copy your results:", t); }
    setTimeout(() => { b.textContent = "Copy my results"; }, 2000);
  }
});
showVoice(); renderList(); renderSum();
</script>
</body>
</html>
